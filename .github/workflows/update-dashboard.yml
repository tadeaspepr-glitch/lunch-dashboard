name: Update lunch dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule běží v UTC a může mít zpoždění.
    # Spouštíme často, ale dashboard generujeme jen v pražském dopoledním okně.
    - cron: "*/15 * * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # kvůli ukládání cache

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run_dashboard: ${{ steps.timecheck.outputs.run_dashboard }}

    steps:
      - name: Check Prague time window
        id: timecheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: dashboard will be generated."
            echo "run_dashboard=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR=$(TZ='Europe/Prague' date +'%H')
          MIN=$(TZ='Europe/Prague' date +'%M')
          NOW=$((10#$HOUR * 60 + 10#$MIN))
          START=$((8 * 60 + 40))
          END=$((11 * 60 + 45))

          echo "Prague time: ${HOUR}:${MIN}"

          if [ "$NOW" -ge "$START" ] && [ "$NOW" -le "$END" ]; then
            echo "run_dashboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_dashboard=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.run_dashboard == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore menu cache
        uses: actions/cache/restore@v4
        with:
          path: .lunch_menu_cache.json
          key: lunch-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lunch-cache-

      - name: Generate dashboard
        env:
          TZ: Europe/Prague
        run: |
          python lunch_dashboard_engine_v69.py --output public/index.html --no-open --cache-file .lunch_menu_cache.json --report public/debug_report.md

      - name: Save menu cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lunch_menu_cache.json
          key: lunch-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
